# Shape of the Secret the LiteLLM chart reads (existingSecret: litellm-secrets). Don't fill this in
# and commit it (SEC-5): run scripts/create-litellm-secrets.sh, or sync it from AWS Secrets Manager
# with External Secrets Operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm
type: Opaque
stringData:
  # Admin key for the proxy: creates virtual keys, sees everything. Start it with "sk-".
  LITELLM_MASTER_KEY: sk-REPLACE_ME
  # Encrypts credentials stored in the DB. Set once and never change it.
  LITELLM_SALT_KEY: sk-REPLACE_ME
  # Registered by the chart as a virtual key allowed only /metrics; Prometheus scrapes with it.
  LITELLM_METRICS_TOKEN: sk-REPLACE_ME
  # Bundled Postgres / Redis (omit if postgres.enabled / redis.enabled are false). URL-safe characters only.
  POSTGRES_PASSWORD: REPLACE_ME
  REDIS_PASSWORD: REPLACE_ME
