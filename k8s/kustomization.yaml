apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Later layers append here: rbac/
# vLLM and LiteLLM are Helm charts (helm/vllm, helm/litellm); KEDA and the observability stack
# (Prometheus, Grafana, DCGM exporter, dashboards) are Terraform helm_releases.
# k8s/litellm/secret.example.yaml is documentation only and deliberately not listed.
resources:
  - namespaces.yaml
  - network/network-policies.yaml
