{{- if .Values.networkPolicy.enabled }}
# SEC-2 for the gateway's own pods. k8s/network/ holds the namespace default-deny and the
# LiteLLM -> vLLM rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "litellm.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - podSelector:
            matchLabels:
              {{- include "litellm.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: metrics-key-job
        {{- if .Values.ingress.enabled }}
        {{- range .Values.networkPolicy.albSourceCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "litellm.postgres.fullname" . }}
  labels:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    {{- include "litellm.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: postgres
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "litellm.gatewaySelectorLabels" . | nindent 14 }}
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "litellm.redis.fullname" . }}
  labels:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
    {{- include "litellm.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: redis
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "litellm.gatewaySelectorLabels" . | nindent 14 }}
{{- end }}
{{- end }}
