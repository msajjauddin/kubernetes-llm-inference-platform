{{- if .Values.postgres.enabled }}
{{- $name := include "litellm.postgres.fullname" . }}
{{- $p := .Values.postgres }}
# Single-instance Postgres for LiteLLM's keys, teams, budgets and spend logs, on a gp3 volume.
# Losing it loses virtual keys; use RDS (externalDatabase) when that matters.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    {{- include "litellm.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
    {{- include "litellm.commonLabels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The alpine image's postgres user (UID 70) owns the data dir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: {{ $p.database }}
            - name: POSTGRES_USER
              value: {{ $p.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            # A subdirectory, because the volume root holds lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-U", {{ $p.user | quote }}, "-d", {{ $p.database | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-U", {{ $p.user | quote }}, "-d", {{ $p.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $p.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.storage.size }}
{{- end }}
