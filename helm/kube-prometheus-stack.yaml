# Rendered by terraform/observability.tf. Chart: prometheus-community kube-prometheus-stack
# Release "monitoring" in namespace observability.
#
#   Prometheus Operator  -> watches ServiceMonitors/PrometheusRules in every namespace
#   Prometheus           -> 7-day retention on gp3 (NFR-6); KEDA queries it for vLLM autoscaling
#                           at http://prometheus-operated.observability.svc:9090
#   Alertmanager         -> receives the LLM platform alerts (helm/prometheus-rules/llm-platform.yaml)
#   Grafana              -> Prometheus datasource + dashboards from grafana-dashboards/
#   kube-state-metrics   -> replicas, HPA, Pending pods, GPU node counts
#   node-exporter        -> runs in kube-system: it needs hostNetwork/hostPID, which the
#                           observability namespace's Pod Security "baseline" level forbids.

# Drops the duplicated suffix from operator-managed object names.
cleanPrometheusOperatorObjectNames: true

crds:
  enabled: true

# EKS runs the control plane, so its components can't be scraped from inside the cluster, and
# kube-proxy only serves metrics on 127.0.0.1. Turning these off avoids permanently-down targets
# and the alerts that would fire for them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

windowsMonitoring:
  enabled: false

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Select every ServiceMonitor / PodMonitor / PrometheusRule in the cluster, not just the ones
    # labelled with this release. The vLLM, LiteLLM, DCGM, KEDA and Cluster Autoscaler charts
    # create theirs in their own namespaces with their own labels.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    # KEDA polls every 15 s (helm/vllm values autoscaling.pollingInterval); scraping vLLM at the
    # same rate keeps scale decisions at most one interval behind the queue.
    scrapeInterval: 15s
    evaluationInterval: 15s

    # NFR-6: 7 days, on a PVC so a restart or reschedule keeps history.
    retention: 7d
    # Stop well short of the volume size so compaction never fills the disk.
    retentionSize: 40GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi

    nodeSelector:
      role: system

  # In-cluster: prometheus-operated.observability.svc:9090 (KEDA, created by the operator) or
  # monitoring-kube-prometheus-prometheus.observability.svc:9090 (Grafana).
  service:
    type: ClusterIP

# ---------------------------------------------------------------------------
# Alertmanager
# ---------------------------------------------------------------------------
# No receivers are configured: alerts are visible in the Alertmanager and Grafana UIs. To page
# someone, add a receiver (Slack, PagerDuty, ...) under alertmanager.config, with the webhook URL
# in a Secret referenced from an AlertmanagerConfig, never in this file.
alertmanager:
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    nodeSelector:
      role: system

# ---------------------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------------------
grafana:
  # The admin password is generated by the chart on first install and kept in the
  # monitoring-grafana Secret (README: "Open Grafana").
  adminUser: admin

  defaultDashboardsTimezone: browser

  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    users:
      default_theme: system

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # ConfigMaps from terraform/observability.tf carry grafana_folder: "LLM Platform".
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        allowUiUpdates: false

  # Dashboards are provisioned from ConfigMaps, so Grafana keeps no state worth a volume.
  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  nodeSelector:
    role: system

# ---------------------------------------------------------------------------
# Exporters
# ---------------------------------------------------------------------------
kube-state-metrics:
  # Exposes the GPU node group label as kube_node_labels{label_workload="gpu-inference"} so the
  # dashboards can count GPU nodes, and the instance type for cost panels.
  metricLabelsAllowlist:
    - nodes=[workload,node.kubernetes.io/instance-type]
  nodeSelector:
    role: system
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  namespaceOverride: kube-system
  # The chart's default toleration (NoSchedule, Exists) already covers the GPU taint, so node
  # metrics (CPU, memory, disk for the model cache) cover GPU nodes too.
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# ---------------------------------------------------------------------------
# Operator
# ---------------------------------------------------------------------------
prometheusOperator:
  nodeSelector:
    role: system
  admissionWebhooks:
    patch:
      nodeSelector:
        role: system
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
